  - name: redact quoted env values and flag values, camelCase and escaped-quote JSON values
    inputs: [{insert_at: redact, type: log, log_fields: {message: 'GITHUB_TOKEN="q1" AWS_SECRET_ACCESS_KEY=''q2'' --password "q3 q4" {"accessToken":"q5","refreshToken":"q6","session_token":"q7","password":"ab\"q8"}'}}]
