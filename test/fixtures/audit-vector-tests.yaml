    inputs: [{insert_at: agents, type: log, log_fields: {_UID: "0", _EXE: "/usr/bin/sudo", _SYSTEMD_UNIT: "session-9.scope", _SYSTEMD_OWNER_UID: "1100", message: "pam_unix(sudo:auth): authentication failure; logname=agent uid=1100 euid=0 tty=/dev/pts/6 ruser=agent rhost=  user=agent"}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert_eq!(.audit.severity, "high")'}]}]
  - name: "enrich: sshd accepting an agent's login is login, high, its agent"
    inputs: [{insert_at: agents, type: log, log_fields: {_UID: "0", _SYSTEMD_UNIT: "sshd.service", message: "Accepted publickey for agent-web from 10.99.0.5 port 52100 ssh2: ED25519 SHA256:abc"}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert_eq!(.audit.kind, "login"); assert_eq!(.audit.severity, "high"); assert_eq!(.audit.agent, "agent-web")'}]}]
  - name: "enrich: a socket-activated sshd's refused attempt for an agent is login, medium"
    inputs: [{insert_at: agents, type: log, log_fields: {_UID: "0", _SYSTEMD_UNIT: "sshd@3-10.99.0.1:22-10.99.0.5:52100.service", message: "Failed publickey for agent from 10.99.0.5 port 52100 ssh2"}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert_eq!(.audit.kind, "login"); assert_eq!(.audit.severity, "medium"); assert_eq!(.audit.agent, "agent")'}]}]
  - name: "enrich: sshd's lines about the operator stay out"
    inputs: [{insert_at: agents, type: log, log_fields: {_UID: "0", _SYSTEMD_UNIT: "ssh.service", message: "Accepted publickey for alice from 10.99.0.5 port 52100 ssh2"}}]
    no_outputs_from: [agents]
  - name: "enrich: an Accepted-shaped line not from sshd is not high"
    inputs: [{insert_at: agents, type: log, log_fields: {_UID: "1100", message: "Accepted publickey for agent from 10.99.0.5 port 1 ssh2"}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert_eq!(.audit.kind, "agent-process"); assert_eq!(.audit.severity, "info")'}]}]
  - name: "enrich: a remote client's user name can't attribute an sshd line to an agent"
    inputs: [{insert_at: agents, type: log, log_fields: {_UID: "0", _SYSTEMD_UNIT: "sshd.service", message: "Failed password for invalid user x for agent-web from 10.99.0.5 port 1 ssh2"}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert!(!exists(.audit.agent)); assert_eq!(.audit.severity, "medium")'}]}]
