# Unit tests for the audit store's Vector filter (vector test), against the config apply renders
# for the test site (agents agent, agent-web, agent-guard; uids 1100-1102): test/agents.bats.
tests:
  - name: keep agent user line
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_UID: "1100", _COMM: "claude", _SYSTEMD_USER_UNIT: "agent-session@x.service", message: "hello"}}]
    outputs: [{extract_from: journal_agents, conditions: [{type: vrl, source: 'assert!(.message == "hello")'}]}]
  - name: drop conmon box output
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_UID: "1100", _COMM: "conmon", message: "screen"}}]
    no_outputs_from: [journal_agents]
  - name: keep envoy unit
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_UID: "0", _SYSTEMD_UNIT: "airlock-envoy-mint.service", message: "minted"}}]
    outputs: [{extract_from: journal_agents, conditions: [{type: vrl, source: 'assert!(.message == "minted")'}]}]
  - name: keep system manager line about user@1101
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_UID: "0", _SYSTEMD_UNIT: "init.scope", UNIT: "user@1101.service", message: "Started User Manager"}}]
    outputs: [{extract_from: journal_agents, conditions: [{type: vrl, source: 'assert!(.message == "Started User Manager")'}]}]
  - name: drop system manager line about another user
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_UID: "0", _SYSTEMD_UNIT: "init.scope", UNIT: "user@1000.service", message: "Started User Manager"}}]
    no_outputs_from: [journal_agents]
  - name: keep logind line naming agent-web
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_UID: "0", SYSLOG_IDENTIFIER: "systemd-logind", message: "New session 5 of user agent-web."}}]
    outputs: [{extract_from: journal_agents, conditions: [{type: vrl, source: 'assert!(contains(string!(.message), "agent-web"))'}]}]
  - name: drop logind line for operator
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_UID: "0", SYSLOG_IDENTIFIER: "systemd-logind", message: "New session 6 of user alice."}}]
    no_outputs_from: [journal_agents]
  - name: drop logind line naming agentx (no boundary)
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_UID: "0", SYSLOG_IDENTIFIER: "systemd-logind", message: "New session 7 of user agentx."}}]
    no_outputs_from: [journal_agents]
  - name: keep sudo line naming agent
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_UID: "0", SYSLOG_IDENTIFIER: "sudo", message: "agent : user NOT in sudoers ; TTY=pts/1"}}]
    outputs: [{extract_from: journal_agents, conditions: [{type: vrl, source: 'assert!(starts_with(string!(.message), "agent :"))'}]}]
  - name: drop unrelated sudo
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_UID: "0", SYSLOG_IDENTIFIER: "sudo", message: "alice : TTY=pts/1 ; COMMAND=/usr/bin/ls"}}]
    no_outputs_from: [journal_agents]
  - name: keep kernel agent drop
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_TRANSPORT: "kernel", message: "airlock-agents-agent-web-drop: IN= OUT=eth0 SRC=10.0.0.5"}}]
    outputs: [{extract_from: journal_agents, conditions: [{type: vrl, source: 'assert!(contains(string!(.message), "-drop:"))'}]}]
  - name: drop other kernel drop
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_TRANSPORT: "kernel", message: "host-input-drop: IN=eth0 SRC=1.2.3.4"}}]
    no_outputs_from: [journal_agents]
  - name: drop unrelated service
    inputs: [{insert_at: journal_agents, type: log, log_fields: {_UID: "0", _SYSTEMD_UNIT: "sshd.service", message: "Accepted publickey for alice"}}]
    no_outputs_from: [journal_agents]
  - name: envoy access line parsed
    inputs: [{insert_at: envoy_fields, type: log, log_fields: {file: "/var/log/airlock-envoy/access.jsonl", message: '{"status":"403","route":"deny-connect","user":"agent"}'}}]
    outputs: [{extract_from: envoy_fields, conditions: [{type: vrl, source: 'assert!(.log_type == "envoy-access" && .route == "deny-connect" && .user == "agent")'}]}]
  - name: envoy web line typed
    inputs: [{insert_at: envoy_fields, type: log, log_fields: {file: "/var/log/airlock-envoy/web.jsonl-20261115T000000Z", message: 'not json'}}]
    outputs: [{extract_from: envoy_fields, conditions: [{type: vrl, source: 'assert!(.log_type == "envoy-web" && .message == "not json")'}]}]
  # redact: standard credential shapes blanked, everything else kept as it was
  - name: redact query token values, any case, name kept
    inputs: [{insert_at: redact, type: log, log_fields: {path: "/api/v1/repos/a/b?a=1&TOKEN=canary-123&access_token=xyz&page=2", message: "x"}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert_eq!(.path, "/api/v1/repos/a/b?a=1&TOKEN=REDACTED&access_token=REDACTED&page=2")'}]}]
  - name: redact query values in the raw envoy line too
    inputs: [{insert_at: redact, type: log, log_fields: {message: '{"path":"/x?api_key=abc123def&q=hello"}'}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert_eq!(.message, "{\"path\":\"/x?api_key=REDACTED&q=hello\"}")'}]}]
  - name: keep ordinary query parameters
    inputs: [{insert_at: redact, type: log, log_fields: {path: "/api/v1/repos/search?q=keyboard&limit=10&sort=updated"}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert_eq!(.path, "/api/v1/repos/search?q=keyboard&limit=10&sort=updated")'}]}]
  - name: redact bearer and basic values
    inputs: [{insert_at: redact, type: log, log_fields: {message: "sent Authorization: Bearer abcdefghijklmnop and basic dXNlcjpwYXNzd29yZA=="}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert!(!contains(string!(.message), "abcdefghijklmnop") && !contains(string!(.message), "dXNlcjpwYXNzd29yZA") && contains(string!(.message), "REDACTED"))'}]}]
  - name: redact url userinfo
    inputs: [{insert_at: redact, type: log, log_fields: {message: "fetch https://alice:s3cretpass@git.example.org/x.git failed"}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert_eq!(.message, "fetch https://alice:REDACTED@git.example.org/x.git failed")'}]}]
  - name: redact vendor token shapes
    inputs: [{insert_at: redact, type: log, log_fields: {message: "ghp_abcdefghijklmnopqrstuvwxyz0123456789 AKIAABCDEFGHIJKLMNOP sk-ant-api03-abcdefghijklmnopqrstuv"}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert_eq!(.message, "REDACTED REDACTED REDACTED")'}]}]
  - name: redact a jwt and a private key header
    inputs: [{insert_at: redact, type: log, log_fields: {message: "jwt eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N and -----BEGIN OPENSSH PRIVATE KEY-----"}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert_eq!(.message, "jwt REDACTED-JWT and REDACTED-PRIVATE-KEY")'}]}]
  - name: keep ordinary journal text
    inputs: [{insert_at: redact, type: log, log_fields: {message: "agent : user NOT in sudoers ; TTY=pts/1 ; COMMAND=/usr/bin/cat /etc/shadow"}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert_eq!(.message, "agent : user NOT in sudoers ; TTY=pts/1 ; COMMAND=/usr/bin/cat /etc/shadow")'}]}]
  - name: a line without message or path passes untouched
    inputs: [{insert_at: redact, type: log, log_fields: {status: "200"}}]
    outputs: [{extract_from: redact, conditions: [{type: vrl, source: 'assert_eq!(.status, "200")'}]}]
