# {web}'s claude-airlock config (docs/agents.md, web research). Root's, read through
# AIRLOCK_CONFIG, which its user manager sets: changed only by the operator. The web and
# Anthropic, nothing else: no repos, no git identity, no pastes.
# The base image (Claude Code without the dev toolchain): research needs no compilers or runtimes.
AIRLOCK_IMAGE=claude-airlock:base
AIRLOCK_EGRESS_MODE=proxy
AIRLOCK_EGRESS_PROXY=/run/airlock-envoy/{web}/{web}-web.sock
# Its own /login per box, kept (no host Claude and no network of its own to mint a token with).
AIRLOCK_PERSIST_LOGIN=1
# Root's managed settings in every box: no messages to or from other Claude sessions on the
# account, no listing them, no artifacts, cloud triggers, scheduled tasks or subagents; no Bash
# and no reading or editing ~/.claude, where the box keeps the account's login. Queue mounts
# come per run from the worker and the session, never all of it.
AIRLOCK_MANAGED_SETTINGS=/usr/local/share/airlock-agents/managed-settings-web.json
# The box's memory directory is its own; the workers and the chat runner empty it before each
# run, so nothing carries from one to the next.
AIRLOCK_SHARE_MEMORY=off
