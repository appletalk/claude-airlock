# {auditor}'s claude-airlock config (docs/agents.md, Audit). Root's, read through AIRLOCK_CONFIG,
# which its user manager sets: changed only by the operator. Anthropic and the audit store
# (read-only queries), nothing else: no web, no repos, no git identity, no pastes.
# The base image (Claude Code without the dev toolchain; curl and jq are there).
AIRLOCK_IMAGE=claude-airlock:base
AIRLOCK_EGRESS_MODE=proxy
AIRLOCK_EGRESS_PROXY=/run/airlock-envoy/{auditor}/{auditor}-store.sock
# Its own /login per box, kept.
AIRLOCK_PERSIST_LOGIN=1
# Root's managed settings in every box: no messages to or from other Claude sessions, no Remote
# Control, no artifacts, triggers, scheduled tasks or subagents, no web tools.
AIRLOCK_MANAGED_SETTINGS=/usr/local/share/airlock-agents/managed-settings-auditor.json
# The box's memory and history are its own (never shared out); audit-run empties them, and
# the rest of the box's ~/.claude but the login, before each run.
AIRLOCK_SHARE_MEMORY=off
AIRLOCK_SHARE_HISTORY=0
# No box CLAUDE.md: each run gets all it needs from its system prompt and starts cold.
AIRLOCK_BOX_CLAUDE_MD=none
