# {guard}'s claude-airlock config (docs/agents.md, web research). Root's, read through
# AIRLOCK_CONFIG, which its user manager sets: changed only by the operator. Anthropic only: no
# web, no repos, no git identity, no pastes.
# The base image (Claude Code without the dev toolchain): the reader runs no tools.
AIRLOCK_IMAGE=claude-airlock:base
AIRLOCK_EGRESS_MODE=proxy
AIRLOCK_EGRESS_PROXY=/run/airlock-envoy/{guard}/{guard}-anthropic.sock
# Its own /login per box, kept.
AIRLOCK_PERSIST_LOGIN=1
# Root's managed settings in every box: as the web user's, and no Remote Control (its runs are
# one-shot; its transcripts are the record).
AIRLOCK_MANAGED_SETTINGS=/usr/local/share/airlock-agents/managed-settings-guard.json
# The box's memory directory is its own; the worker empties it before each run.
AIRLOCK_SHARE_MEMORY=off
