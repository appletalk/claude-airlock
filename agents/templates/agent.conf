# {agent}'s claude-airlock config (docs/agents.md). Root's, read through AIRLOCK_CONFIG, which its
# user manager sets: changed only by the operator (agents/install.sh wrote this default; it is
# yours to edit now and stays as you leave it).
AIRLOCK_IMAGE=claude-airlock:dev
AIRLOCK_SHARE_BASE=/home/{agent}/development
AIRLOCK_ARTIFACT_DIRS=".venv node_modules"
# No network of its own: every box goes out through this airlock-envoy listener (Claude only by
# default; a project can pick another of {agent}'s listeners with `airlock egress proxy`).
AIRLOCK_EGRESS_MODE=proxy
AIRLOCK_EGRESS_PROXY=/run/airlock-envoy/{agent}/{agent}-anthropic.sock
# Pastes the operator hands over (`{command} paste`); every box mounts them read-only.
AIRLOCK_PASTE_DIR={inbox}/pastes
# No host Claude and no network of its own to mint a token with: each box does its own /login
# (through the proxy) and keeps it.
AIRLOCK_PERSIST_LOGIN=1
# Root's managed settings in every box: no messages in from other Claude sessions on the
# account, no artifacts and no cloud triggers (account-level state another agent could write).
AIRLOCK_MANAGED_SETTINGS=/usr/local/share/airlock-agents/managed-settings-agent.json
# Commits from its boxes: whose name they carry (yours, if you review and merge them).
# AIRLOCK_GIT_NAME=
# AIRLOCK_GIT_EMAIL=
