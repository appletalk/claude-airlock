# Podman settings for the agent users, root's: their user managers load it last
# (CONTAINERS_CONF_OVERRIDE in the user@<uid>.service.d drop-in), so a user's own config can't
# undo it from inside a box. crun, not runc: under ProtectProc=invisible runc fails every
# rootless box.
[engine]
runtime = "crun"
