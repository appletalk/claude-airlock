# tmux for the agents' sessions (<agent>-session@.service starts the server with -f, so the
# agent's own ~/.tmux.conf is never read). Root's, like the agents' claude-airlock configs.
# No status bar: the pane is the session.
set -g status off
# No clipboard from the pane to the operator's terminal: the session's tmux runs as the agent user,
# so passing OSC 52 on would let that user write the operator's clipboard. A site that wants
# Claude's copy (a selection, then Ctrl+C) to reach its terminal sets `clipboard on` in
# agents.conf (tmux-clipboard.conf). Clipboard requests and passthrough stay off either way.
set -g set-clipboard off
set -as terminal-features 'foot*:clipboard'
set -s get-clipboard off
set -g allow-passthrough off
# Shift+Enter is a new line in Claude's prompt: tmux sends it on as Alt+Enter, which Claude reads
# as a new line (Claude doesn't take Shift+Enter itself here). Keys into the pane only.
bind -n S-Enter send-keys M-Enter
