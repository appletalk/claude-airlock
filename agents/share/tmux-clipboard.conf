# tmux for the agents' sessions (<agent>-session@.service starts the server with -f, so the
# agent's own ~/.tmux.conf is never read). Root's, like the agents' claude-airlock configs.
# No status bar: the pane is the session.
set -g status off
# Claude's own copy (a selection, then Ctrl+C) reaches the user's clipboard: its OSC 52 is taken
# from the pane and sent on to the terminal (foot's clipboard feature named below; tmux already
# knows xterm* terminals, Windows Terminal among them, take it). Anything the agent user runs in the pane can do the
# same, so this lets that user write the operator's clipboard. A clipboard request from the pane
# is not answered, and passthrough stays off.
set -g set-clipboard on
set -as terminal-features 'foot*:clipboard'
set -s get-clipboard off
set -g allow-passthrough off
# Shift+Enter is a new line in Claude's prompt: tmux sends it on as Alt+Enter, which Claude reads
# as a new line (Claude doesn't take Shift+Enter itself here). Keys into the pane only. Only when
# the terminal sends Shift+Enter as its own key: foot does, Windows Terminal needs a binding
# (docs/agents.md, Terminals).
bind -n S-Enter send-keys M-Enter
